x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__API__ACCESS_CONTROL_ALLOW_ORIGINS: '*'
    AIRFLOW__CORE__TEST_CONNECTION: 'Enabled'
    AIRFLOW_CONN_POSTGRES_DEFAULT: 'postgresql://airflow:airflow@postgres:5432/airflow'
    JAVA_HOME: /usr/lib/jvm/default-java
    SPARK_HOME: /opt/spark
  volumes:
    - ./airflow-dags:/opt/airflow/dags    # bind mount
    - ./spark-jobs:/opt/airflow/spark-jobs
    - ./data_csv:/data_csv                # ← tambahkan ini ke airflow juga
    - airflow_logs:/opt/airflow/logs      # named volume (pakai _)
  depends_on:
    postgres:
      condition: service_healthy

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      AIRFLOW_URL: http://airflow-webserver:8080
      DAGS_FOLDER: /opt/airflow/dags
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data_csv:/data_csv              # bind mount ke host folder
      - ./airflow-dags:/opt/airflow/dags
    restart: unless-stopped

  postgres:
    image: postgres:15
    env_file: .env
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}']
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c '
      airflow db init &&
      airflow users create
        --username admin
        --password admin123
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com &&
      airflow pools set spark_heavy_pool 2 "Heavy Spark tasks" &&
      airflow pools set spark_light_pool 6 "Light Spark tasks" &&
      airflow pools set default_pool 8 "Default pool"
      '
    restart: 'no'

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - '8080:8080'
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.3
    user: root
    environment:
      SPARK_MODE: master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - '8181:8080'
      - '7077:7077'

  spark-worker:
    image: apache/spark:3.5.3
    user: root
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    depends_on: [spark]

  metabase:
    image: metabase/metabase:latest
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  pipeline-studio:
    image: nginx:alpine
    ports:
      - '5173:80'
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - airflow-webserver
      - metabase
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:    # ← pakai underscore, konsisten